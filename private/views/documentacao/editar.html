<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stay This.Positive</title>

    <!-- Bootstrap CSS & custom CSS -->
    <link rel="stylesheet" href="../../../assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../../assets/css/1241327.css"> 

    <!-- Google Fonts -->     
    <link rel="preconnect" href="https://fonts.googleapis.com"> 
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> 
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,700;1,400&display=swap" rel="stylesheet"> 

    <!-- Favicon -->
    <link rel="shortcut icon" href="../../../assets/img/logo branco.png" type="image/png">

    <!-- Fontawesome  -->
    <link rel="stylesheet" href="../../../assets/fontawesome/all.min.css">

</head>

<body>
    <!-- Navbar -->
    <header class="container-fluid admin-navbar text-white">
        <div class="row align-items-center">
            <div class="col-6 d-flex align-items-center p-3">
                <!-- Logo e nome -->
                <a href="../../indexpriv.html">
                    <img src="../../../assets/img/logo branco.png" alt="Logótipo da empresa" height="80" class="me-3">
                </a>
                <h3 class ="mb-0">Stay This.Positive</h3>
            </div>

            <div class="col-6 text-end p-3">
                <div class="dropdown">
                    <button class="btn admin-user-btn dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false"><i class="fa-regular fa-user me-2"></i>Utilizador</button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="#"><i class="fa-solid fa-key me-2"></i>Alterar palavra-passe</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="../../login/login.html"><i class="fa-solid fa-right-from-bracket me-2"></i>Sair</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </header>

    <!-- Botão do menu -->
    <button class="btn admin-menu-btn m-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuLateral"><i class="fa-solid fa-bars"></i></button>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="offcanvas offcanvas-start admin-sidebar text-white" tabindex="-1" id="menuLateral">
                <div class="offcanvas-header">
                    <h4 class="offcanvas-title">Menu</h4>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
                </div>

                <div class="offcanvas-body">
                    <nav>
                        <a href="../equipamentos/listar.html" class="nav-link text-white px-0 mb-3 d-block">
                            <i class="fa-solid fa-laptop-medical"></i> &ensp; Equipamentos</a>
                        <a href="../fornecedores/listar.html" class="nav-link text-white px-0 mb-3 d-block">
                            <i class="fa-solid fa-truck-medical"></i> &ensp; Fornecedores</a>
                        <a href="../localizacoes/listar.html" class="nav-link text-white px-0 mb-3 d-block">
                            <i class="fa-solid fa-house-medical-flag"></i> &ensp; Localizações</a>
                        <a href="listar.html" class="nav-link text-white px-0 mb-3 d-block">
                            <i class="fa-solid fa-clipboard-user"></i> &ensp; Documentação</a>
                        <a href="../garantias_contratos/listar.html" class="nav-link text-white px-0 mb-3 d-block">
                            <i class="fa-solid fa-receipt"></i> &ensp; Garantias/Contratos</a>
                        <a href="../dashboard/dashboard.html" class="nav-link text-white px-0 mb-3 d-block">
                            <i class="fa-solid fa-file-waveform"></i> &ensp; Dashboard</a>
                    </nav>
                </div>
            </div>

            <!-- Conteúdo Principal -->
            <main class="col-12 pt-0 pb-4 px-4">
                <div class="d-flex justify-content-center mt-1">
                    <div class="card admin-card w-100 shadow rounded" style="max-width: 950px;">
                         <div class="card-body">
                            <h2 class="mb-4"><strong><i class="fa-solid fa-square-plus me-2"></i> Editar documento</strong></h2>
                            <form action="#" method="post" novalidate>
                                <!-- Nome e tipo de documento -->
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label for="texto_nome" class="form-label">Nome<span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="texto_nome" placeholder="Ex: Manual do monitor" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="texto_tipo" class="form-label">Tipo de documento<span class="text-danger">*</span></label>
                                        <select class="form-select" id="texto_tipo" name="tipo_documento" required>
                                            <option selected>Escolha uma opção</option>
                                            <option value="manual_utilizador"> Manual do Utilizador</option>
                                            <option value="manual_tecnico">Manual Técnico</option>
                                            <option value="certificado_ce">Certificado CE</option>
                                            <option value="ficha_tecnica">Ficha Técnica</option>
                                            <option value="relatorio_manutencao">Relatório de Manutenção</option>
                                            <option value="calibracao">Certificado de Calibração</option>
                                            <option value="inspecao">Relatório de Inspeção</option>
                                            <option value="outro">Outro</option>
                                        </select>
                                    </div>
                                </div>

                                <!-- Nome/Localização do documento -->
                                <div class="row mb-3">
                                    <div class="col-md-12">
                                        <label for="texto_nome_localizacao" class="form-label">Nome/Localização do documento<span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="texto_nome_localizacao" placeholder="Ex: manual_monitor_3.pdf" required>
                                    </div>
                                </div>

                                <!-- Data de emissão e de validade  -->
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label for="texto_data_emissao" class="form-label">Data de emissão<span class="text-danger">*</span></label>
                                        <input type="date" class="form-control" id="texto_data_emissao" placeholder="Ex: 03/02/2024" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="texto_data_validade" class="form-label">Data de validade<span class="text-danger">*</span></label>
                                        <input type="date" class="form-control" id="texto_data_validade" placeholder="Ex: 03/08/2026" required>
                                    </div>
                                </div>

                                <!-- Equipamento e Fornecedor associados -->
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label for="texto_equipamento" class="form-label">Equipamento associado<span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="texto_equipamento" placeholder="Ex: Monitor 24 polegadas" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="texto_fornecedor" class="form-label">Fornecedor associado<span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="texto_fornecedor" placeholder="Ex: Samsung" required>
                                    </div>
                                </div>

                                <!-- Observações -->
                                <div class="row mb-3">
                                    <div class="col-12">
                                        <label for="texto_observacoes" class="form-label">Observações</label>
                                        <textarea class="form-control" id="texto_observacoes" placeholder="Ex: Versão atual do documento. Revisão efetuada em janeiro de 2026." rows="4"></textarea>
                                    </div>
                                </div>

                                <!-- Botões -->
                                <div class="d-flex justify-content-center gap-3 mb-4">
                                    <a href="listar.html" class="btn admin-btn-cancel">
                                        <i class="fa-solid fa-xmark me-1"></i>Cancelar
                                    </a>
                                    <button type="submit" class="btn admin-btn-save">
                                        <i class="fa-regular fa-floppy-disk me-1"></i>Guardar
                                    </button>
                                </div>

                                <!-- Erros -->
                                <div class="alert alert-danger text-center d-none" role="alert"> Erro </div>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>                         

    <!-- Bootstrap JS and custom JS --> 
    <script src="../../../assets/js/bootstrap.bundle.min.js"></script>


</body>
</html>
