<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stay This.Positive</title>

    <!-- Bootstrap CSS & custom CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/1241327.css"> 

    <!-- Favicon -->
    <link rel="shortcut icon" href="../../assets/img/logo branco.png" type="image/png">

    <!-- Fontawesome  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"> 

    <!-- Google Fonts -->     
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;700&display=swap" rel="stylesheet"> 

</head>
<body class="login-page">
    <!-- Bootstrap JS e custom JS -->     
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7 col-sm-9 col-11">
                <!-- Borda do formulário --> 
                <div class="card p-4">
                    <div>
                        <div class="position-relative mb-4">
                            <!-- Ícone do utilizador -->
                            <div class="login-icon"><i class="fa-solid fa-user"></i></div>
                            
                            <!-- Título -->
                            <h2 class="text-center"><strong>Login</strong></h2>
                        </div> 
                    </div>  
                    
                    <div class="row">
                        <div class="col">
                            <!-- Formulário -->
                            <form action="" method="post">
                                <div class="mb-3">
                                    <!-- User -->
                                    <label for="email" class="form-label">Utilizador</label>
                                    
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                                        <input type="email" name="email" id="email" class="form-control">
                                    </div>
                                </div> 
                                
                                <div class="mb-3">
                                    <!-- Password -->
                                    <label for="password" class="form-label">Palavra-passe</label>

                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                        <input type="password" name="password" id="password" class="form-control">
                                    </div>
                                </div> 

                                <p class="text-center mt-3">
                                    <a href ="#" class="forgot-password">Esqueceu-se da palavra-passe?</a>       
                                </p>

                                <div class="mb-3 text-center">
                                    <!-- Voltar à página inicial -->
                                    <a href="../../public/index.html" class="btn btn-secondary px-4">Voltar<i class="fa-solid fa-rotate-left ms-2"></i></a>
                                    <!-- Submit -->
                                    <button type="submit" class="btn btn-secondary px-4">Entrar <i class="fa-solid fa-right-to-bracket ms-2"></i></button>
                                </div> 

                                <div class="alert alert-danger p-2 text-center d-none">
                                    <!-- Error messagem -->
                                    Erro: Utilizador ou palavra-passe inválidos
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
