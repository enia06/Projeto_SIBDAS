<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stay This.Positive</title>

    <!-- Bootstrap CSS & custom CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/1241327.css"> 

    <!-- Favicon -->
    <link rel="shortcut icon" href="../../assets/img/logo branco.png" type="image/png">

    <!-- Fontawesome  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"> 

    <!-- Google Fonts -->     
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;700&display=swap" rel="stylesheet"> 

</head>
<body>
    <!-- Bootstrap JS e custom JS -->     
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <div class="container-fluid mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-6 col-sm-8 col-10">
                <!-- Borda do formulário --> 
                <div class="card p-4">
                    <div>
                        <!-- Imagem da empresa e texto -->
                        <div class="d-flex align-items-center justify-content-center mb-4">
                            <img src="../../assets/img/logo branco.png" alt="Logótipo da Empresa">
                            <h2><strong>Stay This.Positive</strong></h2>
                        </div> 
                    </div>  
                    
                    <div class="row">
                        <div class="col">
                            <!-- Formulário -->
                            <form action="" method="post">
                                <div class="mb-3">
                                    <!-- User -->
                                    <label for="email" class="form-label">Utilizador</label>
                                    <input type="email" name="email" id="email" class="form-control">
                                </div> 
                                
                                <div class="mb-3">
                                    <!-- Password -->
                                    <label for="password" class="form-label">Palavra-passe</label>
                                    <input type="password" name="password" id="password" class="form-control">
                                </div> 

                                <div class="mb-3 text-center">
                                    <!-- Submit -->
                                    <button type="submit" class="btn btn-secondary px-4">Entrar <i class="fa-solid fa-right-to-bracket ms-2"></i></button>
                                </div> 

                                <div class="alert alert-danger p-2 text-center">
                                    <!-- Error messagem -->
                                    Erro: Utilizador ou palavra-passe inválidos
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
